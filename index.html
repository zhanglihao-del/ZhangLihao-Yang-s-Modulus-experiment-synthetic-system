// ========== 导航切换JS（完全不用动） ==========
const navItems = document.querySelectorAll('.nav-item');
const pageBoxs = document.querySelectorAll('.page-box');
navItems.forEach(item=>{
item.onclick = function(){
// 清空所有激活
navItems.forEach(nav=>nav.classList.remove('active'));
pageBoxs.forEach(page=>page.classList.remove('active'));
// 当前选中激活

// ========== 原计算器JS（原样不动，仅新增科学计数格式化函数、修正U_E_Pa格式化） ==========
function calculate() {
// 通用科学计数格式化：把e+替换成×10^
function formatSci(num, precision=2){
return num.toExponential(precision).replace('e+','×10^');
}
//【新增强制统一输出 10^11 格式化函数，只修改输出文本，数值不变】
function formatTo10Pow11(num, precision=3){
const val = num / 1e11;
return val.toFixed(precision) + "×10^11";
}
//【新增：紧凑标准形式 1.980(18)×10^11 输出函数】
function formatCompactResult(E_val, uE_val){
// E_val, uE_val 单位：N/m²
const base = 1e11;
const e_scaled = E_val / base;
const u_scaled = uE_val / base;
// 保留3位小数
const e_str = e_scaled.toFixed(3);
// 不确定度对应小数部分两位数字
const u_digits = Math.round(u_scaled * 1000);
// 直接取后两位，不再除以10
return `${e_str}(${u_digits})×10^11`;
}

document.getElementById('result').innerText = "";
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const rect = canvas.getBoundingClientRect();
canvas.width = rect.width;
canvas.height = rect.height;
ctx.clearRect(0,0,canvas.width,canvas.height);

try {
const L = Number(document.getElementById('L').value);
const H = Number(document.getElementById('H').value);
const D = Number(document.getElementById('D').value);
const g = Number(document.getElementById('g').value);
const pi = 3.14159265;

const d0 = Number(document.getElementById('d0').value);
const d_arr = [
Number(document.getElementById('d1').value),
Number(document.getElementById('d2').value),
Number(document.getElementById('d3').value),
Number(document.getElementById('d4').value),
Number(document.getElementById('d5').value)
];
const d_raw = d_arr.reduce((a,b)=>a+b,0) / d_arr.length;
const d_correct = d_raw - d0;
const d = Math.round(d_correct * 1000) / 1000;

// 直径A类不确定度
const n_d = d_arr.length;
let sum_d2 = 0;
d_arr.forEach(val => sum_d2 += (val - d_raw)**2);
const s_d = Math.sqrt(sum_d2 / (n_d - 1));
const uA_d = s_d / Math.sqrt(n_d);

// 直径B类不确定度
const delta_ins_d = 0.004;
const uB_d = delta_ins_d / 3;      //由const uB_d = delta_ins_d / Math.sqrt(3);  改为 const uB_d = delta_ins_d / 3;

// 直径合成不确定度
const u_d = Math.sqrt(uA_d**2 + uB_d**2);

//
const m = document.getElementById('m_list').value.split(',').map(Number).filter(n=>!isNaN(n));
const add = document.getElementById('add_list').value.split(',').map(Number).filter(n=>!isNaN(n));
const sub = document.getElementById('sub_list').value.split(',').map(Number).filter(n=>!isNaN(n));

if(m.length!==add.length || add.length!==sub.length || m.length<2){
throw new Error("数据长度不一致！");
}

// 遍历add数组，i为数组下标；对每一组，取同侧加、减载荷形变量的平均值，得到平均伸长量x_mean
// 物理意义：加载、卸载同一砝码得到两个形变，取平均抵消迟滞误差，得到更准确的伸长量
const x_mean = add.map((_,i) => (add[i]+sub[i])/2);
// 每个质量mi乘以重力加速度g，得到对应拉力F=mg，构造拉力数组
const F = m.map(mi => mi * g);

//获得数据点总组数n
const n = F.length;
// 初始化最小二乘需要的4个累加变量：拉力总和、形变总和、F*x乘积总和、F平方总和
let sumF=0, sumX=0, sumFX=0, sumF2=0;
// 遍历所有测点，累加各项求和
for(let i=0; i<n; i++){
sumF += F[i];                  // ΣF：所有拉力相加
sumX += x_mean[i];             // Σx：所有平均伸长量相加
sumFX += F[i] * x_mean[i];     // ΣFx：拉力、伸长量乘积求和
sumF2 += F[i]**2;              // ΣF²：拉力的平方求和
}

//最小二乘拟合 k 斜率、intercept截距
// 最小二乘法斜率公式：k = (nΣFx - ΣF·Σx) / (nΣF²-(ΣF)²)，对应F=kx+b里的斜率k
const k = (n*sumFX - sumF*sumX) / (n*sumF2 - sumF**2);
// 截距b = x̄ - k·F̄；x̄是伸长量平均值，F̄是拉力平均值，得到拟合直线纵轴截距intercept
const intercept = (sumX/n) - k*(sumF/n);

//========== 1. 残差法求斜率A类不确定度 uA_k ==========
let S = 0;
for(let i=0; i<n; i++){
// 根据拟合直线算出理论预测值 x̂ᵢ = k·Fᵢ + b
const x_pred = k*F[i] + intercept;
// 残差平方累加：(实测xᵢ - 预测x̂ᵢ)²
S += (x_mean[i] - x_pred)**2;
}

// sₓ：拟合的标准偏差（剩余标准差）
// 自由度 n-2：直线拟合有k、b两个待求参数
const s_x = Math.sqrt(S/(n-2));
// F的平均值
const meanF = sumF/n;
// Σ(Fᵢ - F̄)² 自变量F离均差平方和
let sumF_dev2 = 0;
F.forEach(f => sumF_dev2 += (f - meanF)**2);
// 斜率k的A类标准不确定度 uA(k)
const uA_k = s_x / Math.sqrt(sumF_dev2);

// ========== 2. 【新增】相关系数 r ==========
let sum_xF = 0, sum_x = 0, sum_F = 0, sum_x2 = 0, sum_F2 = 0;
for(let i = 0; i < n; i++){
sum_xF += x_mean[i] * F[i];
sum_x += x_mean[i];
sum_F += F[i];
sum_x2 += x_mean[i] ** 2;
sum_F2 += F[i] ** 2;
}
const x_bar = sum_x / n;
const F_bar = sum_F / n;
const xF_bar = sum_xF / n;
const x2_bar = sum_x2 / n;
const F2_bar = sum_F2 / n;
const numerator = xF_bar - x_bar * F_bar;
const denominator = Math.sqrt( (F2_bar - F_bar**2) * (x2_bar - x_bar**2) );
const r = numerator / denominator;
// 可选：用r验算uA_k，用来核对计算是否出错
const uA_k_from_r = k * Math.sqrt( (1/(r**2)-1)/(n-2) );

### 3.1 应力与应变基础定义
- 应力：单位横截面积承受的拉力
$$\text{应力} = \frac{F}{S}$$
$F$为金属丝拉力，$S$为金属丝横截面积。
- 应变：单位原长对应的伸长量，无量纲
$$\text{应变} = \frac{\Delta L}{L}$$
$L$为金属丝原始总长，$\Delta L$为拉力作用下金属丝微小伸长量。

### 3.2 杨氏模量核心公式（胡克定律弹性区间）
弹性形变范围内，应力与应变成正比，比例系数即为杨氏模量$E$：
$$\frac{F}{S}=E \cdot \frac{\Delta L}{L}$$
移项得到杨氏模量定义式：
$$E=\frac{F/S}{\Delta L/L}$$
单位：$\mathrm{N\cdot m^{-2}}$，工程常用换算 $1\ \mathrm{GPa}=10^9\ \mathrm{N\cdot m^{-2}}=1000\ \mathrm{N/mm^2}$。

金属丝圆形横截面积：
$$S=\frac{1}{4}\pi d^2$$
$d$为金属丝直径。

### 3.3 光杠杆微小形变放大原理
当金属丝受力后，产生微小伸长，后足尖便随测量端面一起作微小移动，并使光杠杆绕前足尖连线转动一微小角度，从而带动光杠杆反射镜转动相应的微小角度，这样标尺的像通过光杠杆的反射镜反射到望远镜里，便把这一微小角位移放大成较大的线位移。

$$\tan\theta=\frac{\Delta L}{D}\approx\theta$$
$$\tan2\theta=\frac{\Delta x}{H}\approx2\theta$$
联立消去$\theta$，得到微小伸长量与标尺读数关系：
$$\Delta x=\frac{2H}{D}\cdot \Delta L$$
**光杠杆放大倍数 $M=\dfrac{2H}{D}$**
- $H$：镜尺距，光杠杆镜面转轴到竖直标尺的垂直距离；
- 增大放大倍数两种方法：增大镜尺距$H$、减小光杠杆常数$D$。

将$F=mg$、$S=\dfrac{1}{4}\pi d^2$、$\Delta L=\dfrac{D\cdot \Delta x}{2H}$代入杨氏模量定义式，化简得到实验计算公式：
$$E=\frac{8mgLH}{\pi d^2 D \Delta x}$$

div.innerText = `${idx + 1}. ${item}`;
div.onclick = () => copyQuestion(item);
box.appendChild(div);
});
}
