<script>
// ========== 导航切换JS（完全不用动） ==========
const navItems = document.querySelectorAll('.nav-item');
const pageBoxs = document.querySelectorAll('.page-box');
navItems.forEach(item=>{
    item.onclick = function(){
        // 清空所有激活
        navItems.forEach(nav=>nav.classList.remove('active'));
        pageBoxs.forEach(page=>page.classList.remove('active'));
        // 当前选中激活
        this.classList.add('active');
        const targetId = this.getAttribute('data-page');
        document.getElementById(targetId).classList.add('active');
    }
})

// ========== 原计算器JS（原样不动，仅新增科学计数格式化函数、修正U_E_Pa格式化） ==========
function calculate() {
    // 通用科学计数格式化：把e+替换成×10^
    function formatSci(num, precision=2){
        return num.toExponential(precision).replace('e+','×10^');
    }
    //【新增强制统一输出 10^11 格式化函数，只修改输出文本，数值不变】
    function formatTo10Pow11(num, precision=3){
        const val = num / 1e11;
        return val.toFixed(precision) + "×10¹¹";
    }
    //【新增：紧凑标准形式 1.980(18)×10^11 输出函数】
    function formatCompactResult(E_val, uE_val){
        // E_val, uE_val 单位：N/m²
        const base = 1e11;
        const e_scaled = E_val / base;
        const u_scaled = uE_val / base;
        if (!(u_scaled > 0) || !Number.isFinite(e_scaled) || !Number.isFinite(u_scaled)) {
            throw new Error('标准不确定度无法规范表示！');
        }

        const uncertaintyExponent = Math.floor(Math.log10(u_scaled));
        const firstDigit = Math.floor(u_scaled / (10 ** uncertaintyExponent));
        const significantDigits = firstDigit <= 2 ? 2 : 1;
        const decimals = Math.max(0, -uncertaintyExponent + significantDigits - 1);
        const scale = 10 ** decimals;
        const roundedUncertainty = Math.round(u_scaled * scale) / scale;
        const e_str = e_scaled.toFixed(decimals);
        const u_digits = Math.round(roundedUncertainty * scale);
        return `${e_str}(${u_digits})×10¹¹`;
    }

    function readNumber(id, label, { positive = false } = {}) {
        const raw = document.getElementById(id).value.trim();
        const value = Number(raw);
        if (!raw || !Number.isFinite(value)) {
            throw new Error(`${label}必须填写有效数字！`);
        }
        if (positive && value <= 0) {
            throw new Error(`${label}必须大于0！`);
        }
        return value;
    }

    function readNumberList(id, label) {
        const raw = document.getElementById(id).value.trim();
        const parts = raw.split(',').map(item => item.trim());
        if (!raw || parts.some(item => item === '')) {
            throw new Error(`${label}存在空项，请检查逗号位置！`);
        }
        const values = parts.map(Number);
        if (values.some(value => !Number.isFinite(value))) {
            throw new Error(`${label}包含非数字内容！`);
        }
        return values;
    }


    document.getElementById('result').innerText = "";
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    try {
        const L = readNumber('L', '金属丝有效原长L', { positive: true });
        const H = readNumber('H', '镜尺距H', { positive: true });
        const D = readNumber('D', '光杠杆常数D', { positive: true });
        const g = readNumber('g', '重力加速度g', { positive: true });
        const pi = 3.14159265;

        const d0 = readNumber('d0', '直径零点读数d0');
        const d_arr = [
            readNumber('d1', '直径测量1', { positive: true }),
            readNumber('d2', '直径测量2', { positive: true }),
            readNumber('d3', '直径测量3', { positive: true }),
            readNumber('d4', '直径测量4', { positive: true }),
            readNumber('d5', '直径测量5', { positive: true })
        ];
        const d_raw = d_arr.reduce((a,b)=>a+b,0) / d_arr.length;
        const d_correct = d_raw - d0;
        const d = Math.round(d_correct * 1000) / 1000;
        if (d <= 0) {
            throw new Error('零点修正后的金属丝直径必须大于0！');
        }

        // 直径A类不确定度
        const n_d = d_arr.length;
        let sum_d2 = 0;
        d_arr.forEach(val => sum_d2 += (val - d_raw)**2);
        const s_d = Math.sqrt(sum_d2 / (n_d - 1));
        const uA_d = s_d / Math.sqrt(n_d);

        // 直径B类不确定度
        const delta_ins_d = 0.004;
        const uB_d = delta_ins_d / 3;      //由const uB_d = delta_ins_d / Math.sqrt(3);  改为 const uB_d = delta_ins_d / 3;

        // 直径合成不确定度
        const u_d = Math.sqrt(uA_d**2 + uB_d**2);
        
        // 
        const m = readNumberList('m_list', '砝码质量');
        const add = readNumberList('add_list', '加载标尺读数');
        const sub = readNumberList('sub_list', '卸载标尺读数');

        if (m.length !== add.length || add.length !== sub.length) {
            throw new Error('砝码质量、加载读数和卸载读数的数据组数必须一致！');
        }
        if (m.length < 3) {
            throw new Error('线性拟合及斜率不确定度计算至少需要3组数据！');
        }
        if (m.some(value => value <= 0)) {

        function getNiceAxis(values, targetIntervals = 6) {
            let minValue = Math.min(...values);
            let maxValue = Math.max(...values);
            if (minValue === maxValue) {
                const offset = Math.abs(minValue) > 0 ? Math.abs(minValue) * 0.1 : 1;
                minValue -= offset;
                maxValue += offset;
            }

            const roughStep = (maxValue - minValue) / targetIntervals;
            const magnitude = 10 ** Math.floor(Math.log10(roughStep));
            const normalized = roughStep / magnitude;
            const niceFactor = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
            const step = niceFactor * magnitude;
            const min = Math.floor(minValue / step) * step;
            const max = Math.ceil(maxValue / step) * step;
            return { min, max, step };
        }

        function formatTick(value, step) {
            const decimals = step >= 1 ? 0 : Math.min(4, Math.ceil(-Math.log10(step)));
            return Number(value.toFixed(decimals)).toString();

2. 光杠杆组件：平面反射镜、三足支架（1后足+2前足）；
3. 望远镜+背光标尺观测系统：望远镜可俯仰、左右微调，带分划叉丝；
4. 砝码组及加载装置：记录加载质量$m$，并按$F=mg$换算金属丝所受拉力；
5. 测量量具：
    - 钢卷尺：测量金属丝总长$L$、镜尺距$H$，精度1mm；
    - 游标卡尺：测量光杠杆常数$D$，精度0.02mm；
    - 螺旋测微器（千分尺）：测量金属丝直径$d$，精度0.001mm；
6. 配套电源、数据连接线。

## 五、完整实验操作内容（匹配PPT分步调节+测量流程）
### 5.1 仪器调节与准备
1. 调平实验支架底座，确保金属丝处于竖直状态；
2. 放置光杠杆，保证后足压在夹头平台，前足平稳放置于固定台；**注意：后足严禁触碰金属丝**； 
3. 连接拉力传感器与标尺电源，清零拉力计；
4. 施加预拉力，消除金属丝内部松弛。

### 5.2 光路调节
1. 粗调望远镜位置，使望远镜与平面镜转轴等高；
2. 校准望远镜水平，调整目镜与物镜焦距，消除视差；
3. 将标尺刻度对准叉丝中心，记录初始读数。

### 5.3 物理量测量
1. 测量金属丝总长$L$、镜尺距$H$、光杠杆常数$D$；
2. 使用螺旋测微器测量金属丝直径$d$，修正零点误差；
3. 逐级加载与卸载拉力，记录对应标尺读数，取平均值以消除回程误差。

## 六、数据处理规范
1. 直径数据：5次测量求算术平均，修正零点误差，计算A类不确定度；螺旋测微器仪器误差计算B类不确定度，合成得到直径总不确定度；
2. 拉力-刻度数据：每组载荷取加、减砝码读数均值，得到$F-x$对应数组；
3. 两种标准处理方法：
    - 逐差法：8组数据分为前4组、后4组对应相减，充分利用全部测量数据，消除线性系统误差；
    - 最小二乘法一元线性拟合：求解拟合斜率$k$、截距$b$，绘制$F-x$标准曲线，计算斜率不确定度；
4. 代入完整杨氏模量公式计算$E$：

$$E=\frac{8LH}{\pi d^2 D k}$$

5. 根据不确定度传递公式计算$E$的相对不确定度和合成标准不确定度。$E$与$u(E)$可用$\mathrm{N/mm^2}$表示，并统一换算为$\mathrm{N/m^2}$；最终采用标准不确定度紧凑形式$E=a(b)\times10^{11}\ \mathrm{N/m^2}$，括号内数字表示合成标准不确定度在末位对应的数值。

## 七、主要误差来源（系统误差+随机误差）
### 系统误差（可通过操作消除/减小）
1. 仪器底座未调平、光杠杆倾斜、镜面不垂直，放大倍数$M$偏离理论值；
2. 金属丝存在弯曲、未预拉，初始存在塑性松弛形变；
3. 望远镜存在视差，标尺读数人为偏移；
4. 螺旋测微器零点未修正，直径存在固定偏移；
5. 加载、卸载回程间隙，同一拉力读数不重合。
### 随机误差（只能减小无法完全消除）
1. 实验台面轻微震动，光杠杆镜面微小晃动；
2. 肉眼估读标尺刻度、千分尺读数带来微小偏差；
3. 环境温度变化，金属丝热胀冷缩改变长度与直径。

## 八、实验拓展思考题
1. 若实验测得镜尺距$H$偏大，最终计算出的杨氏模量$E$偏大还是偏小？
2. 金属丝直径$d$的误差对$E$影响远大于$L、H、D$，为什么？（公式中$d$为平方项）
3. 对比光杠杆法、千分表法测微小形变，分别说明两种方案优缺点；
4. 同种金属丝在高温、低温环境下杨氏模量是否变化？简述材料机理；
5. 若$F-x$曲线明显弯曲偏离直线，代表金属丝进入什么形变区间？会带来什么计算问题？
6. 放大倍数越大实验精度一定越高吗？过大的$M$会带来哪些实验缺陷？

## 九、实验安全与仪器使用禁忌
1. 拉力严禁超过仪器最大安全载荷，防止金属丝断裂、支架变形；
2. 调节螺旋测微器禁止用力拧棘轮，挤压金属丝造成永久形变；
3. 望远镜、光杠杆镜面为光学玻璃，禁止用手直接触摸镜片，避免指纹油污；
4. 增减拉力轻缓操作，禁止猛拉猛放，防止光杠杆剧烈跳动移位；
5. 实验结束先卸载全部拉力，再收纳光杠杆、量具，清洁光学部件后存放。
`;

function renderMarkdownWithProtectedMath(source, target) {
    const blockMath = [];
    const inlineMath = [];
    const addBlock = formula => {
        const index = blockMath.push(formula) - 1;
        return `\n<div data-ai-math-block="${index}"></div>\n`;
    };
    const addInline = formula => {
        const index = inlineMath.push(formula) - 1;
        return `<span data-ai-math-inline="${index}"></span>`;
    };

    let protectedText = source
        .replace(/\$\$([\s\S]*?)\$\$/g, (_, formula) => addBlock(formula))
        .replace(/\\\[([\s\S]*?)\\\]/g, (_, formula) => addBlock(formula))
        .replace(/\\\(([^\n]*?)\\\)/g, (_, formula) => addInline(formula))
        .replace(/\$([^$\n]+?)\$/g, (_, formula) => addInline(formula));

    target.innerHTML = marked.parse(protectedText);
    target.querySelectorAll('[data-ai-math-block]').forEach(node => {
        const formula = blockMath[Number(node.dataset.aiMathBlock)] || '';
        node.textContent = `$$\n${formula.trim()}\n$$`;
    });
    target.querySelectorAll('[data-ai-math-inline]').forEach(node => {
        const formula = inlineMath[Number(node.dataset.aiMathInline)] || '';
        node.textContent = `$${formula.trim()}$`;
    });
}
